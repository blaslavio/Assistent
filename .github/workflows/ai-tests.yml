name: AI regressietests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer testafhankelijkheden
        run: python -m pip install httpx
      - name: Compileer Python-bronbestanden
        run: python -m compileall -q .
      - name: Draai AI-regressietests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
