name: Veiligheid en regressietests
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeer testafhankelijkheden
        run: python -m pip install -r requirements.txt pytest
      - name: Controleer Python-syntax
        run: python -m compileall -q .
      - name: Test agenda URL-beveiliging
        run: python -m unittest discover -s tests -p 'test_*.py' -v
