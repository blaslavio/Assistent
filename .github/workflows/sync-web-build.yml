name: Controleer gegenereerde webapp
on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/app/**'
      - 'nieuwe_app/**'
      - '.github/workflows/sync-web-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installeer vastgepinde dependencies
        run: npm ci
        working-directory: web
      - name: Tests
        run: npm test
        working-directory: web
      - name: Bouw beide webvarianten
        run: npm run build
        working-directory: web
      - name: Controleer build-startpunten en versieverwijzing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, stat } from 'node:fs/promises';
          import { join } from 'node:path';
          const checks = ['docs/app/index.html', 'docs/app/versie.json', 'nieuwe_app/app.js', 'nieuwe_app/app.css'];
          for (const file of checks) {
            const details = await stat(file);
            if (!details.isFile() || details.size === 0) throw new Error('Leeg of ontbrekend buildbestand: ' + file);
          }
          const version = JSON.parse(await readFile('docs/app/versie.json', 'utf8'));
          if (typeof version.script !== 'string' || !version.script.startsWith('assets/') || !version.script.endsWith('.js') || version.script.includes('..') || version.script.includes('\\\\')) {
            throw new Error('Ongeldige scriptreferentie in docs/app/versie.json');
          }
          const scriptFile = join('docs/app', version.script);
          if (!(await stat(scriptFile)).isFile()) throw new Error('Versiescript bestaat niet: ' + scriptFile);
          const html = await readFile('docs/app/index.html', 'utf8');
          if (!html.includes('assets/') || !html.includes('<script')) throw new Error('Webapp-index mist een script-entry');
          NODE
      - name: Maak bestandsmanifest voor onafhankelijke review
        run: |
          find docs/app nieuwe_app -type f -print0 | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/web-build.sha256"
          test -s "$RUNNER_TEMP/web-build.sha256"
      - name: Bewaar gegenereerde bestanden als controle-artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-voor-review
          path: |
            docs/app
            nieuwe_app
            ${{ runner.temp }}/web-build.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Controleer gegenereerde bestanden
        run: |
          git add -N -- docs/app nieuwe_app
          if ! git diff --quiet -- docs/app nieuwe_app; then
            git diff --stat -- docs/app nieuwe_app
            echo "::error::Generated assets differ. Download the build artifact and commit changes through a reviewed PR."
            exit 1
          fi
