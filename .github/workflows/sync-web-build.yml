name: Controleer gegenereerde webapp
on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/app/**'
      - 'nieuwe_app/**'
      - '.github/workflows/sync-web-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installeer vastgepinde dependencies
        run: npm ci
        working-directory: web
      - name: Tests
        run: npm test
        working-directory: web
      - name: Bouw beide webvarianten
        run: npm run build
        working-directory: web
      - name: Controleer gegenereerde bestanden
        run: |
          if ! git diff --exit-code -- docs/app nieuwe_app; then
            echo "::error::Generated assets differ. Commit rebuilt assets through a reviewed PR."
            exit 1
          fi
