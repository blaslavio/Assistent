name: Synchroniseer gebouwde webapp
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/app/**'
      - 'nieuwe_app/**'
      - '.github/workflows/sync-web-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-web-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'blaslavio/Assistent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installeer vastgepinde dependencies
        run: npm ci
        working-directory: web
      - name: Tests
        run: npm test
        working-directory: web
      - name: Bouw beide webvarianten
        run: npm run build
        working-directory: web
      - name: Synchroniseer alleen gegenereerde bestanden
        run: |
          git add -- docs/app nieuwe_app
          if git diff --cached --quiet; then
            echo "Gebouwde bestanden zijn actueel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchroniseer gegenereerde webapp"
          git push origin HEAD:main
