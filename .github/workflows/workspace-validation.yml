name: Workspace validation
on:
  push:
    paths:
      - 'workspace_safe.py'
      - 'tests/test_workspace_safe.py'
      - '.github/workflows/workspace-validation.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m py_compile workspace_safe.py
      - run: python -m pytest -q tests/test_workspace_safe.py
