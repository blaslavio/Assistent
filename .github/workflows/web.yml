name: App
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Tests
        run: npm test
        working-directory: web
      - name: Bouwen
        run: npm run build
        working-directory: web
      - name: Gebouwde app is bijgewerkt
        run: git diff --exit-code -- docs/app nieuwe_app || (echo "Draai npm --prefix web run build en zet docs/app en nieuwe_app mee in de commit." && exit 1)
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py nieuwe_app.py
