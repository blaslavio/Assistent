name: App
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Tests
        run: npm test
        working-directory: web
      - name: Bouwen
        run: npm run build
        working-directory: web
      - name: Gebouwde app is bijgewerkt
        run: git diff --exit-code -- docs/app nieuwe_app || (echo "Draai npm --prefix web run build en zet docs/app en nieuwe_app mee in de commit." && exit 1)
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py nieuwe_app.py
      - name: Execute Streamlit startup regression tests
        run: python -m unittest -v test_streamlit_startup
      - name: Verify Streamlit HTTP server health
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/streamlit-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          healthy=false
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
              healthy=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/streamlit-startup.log
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            cat /tmp/streamlit-startup.log
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8501/ >/dev/null
