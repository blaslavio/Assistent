name: Rive CLI asset build (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-rive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check RML project exists
        run: |
          test -f rive-project/scene.rml || {
            echo "Missing rive-project/scene.rml. Add RML scene before compiling a .riv.";
            exit 1;
          }
      - name: Install official Rive CLI
        run: |
          curl -fsSL https://releases.rive.app/cli/install.sh -o install-rive.sh
          bash install-rive.sh
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Verify and build
        run: |
          rive rive-project --verify
          rive rive-project --once
          test -s rive-project/build/rive-project.riv
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-rive-export
          path: rive-project/build/rive-project.riv
