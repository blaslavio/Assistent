name: Intake isolation and regression gate
on:
  pull_request:
  push:
    branches: [feature/private-service-intake-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake-regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q .
      - name: Intake and storage boundary tests (no live data)
        run: python -m pytest -q tests/test_service_intake_core.py tests/test_service_preparation.py tests/test_ecosystem_integration.py tests/test_intake_storage_boundary.py tests/test_entra_provider_guard.py
      - name: Full regression suite
        run: python -m pytest -q
