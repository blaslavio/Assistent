name: Diagnose Streamlit Cloud bereikbaarheid
on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'app.py'
      - 'nieuwe_app.py'
      - '.github/workflows/streamlit-cloud-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Controleer publiek Streamlit-gezondheidseindpunt
        shell: bash
        env:
          APP_URL: https://eisreyyrtvlgtjpqiyhpm2.streamlit.app
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ["APP_URL"].rstrip("/") + "/_stcore/health"
          req = urllib.request.Request(url, headers={"User-Agent": "UniversalOS-Cloud-Health/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=40) as response:
                  text = response.read(200).decode("utf-8", "replace").strip()
                  print(f"Cloud health HTTP {response.status}; response: {text[:100]!r}")
                  if response.status == 200 and text.lower() in {"ok", "healthy"}:
                      print("Extern Streamlit-gezondheidseindpunt bereikbaar")
                  else:
                      print("::error::Cloud reageert, maar geeft geen gezonde Streamlit-status")
                      sys.exit(1)
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              print(f"::error::Streamlit Cloud niet bereikbaar: {type(exc).__name__}: {str(exc)[:250]}")
              sys.exit(1)
          PY
