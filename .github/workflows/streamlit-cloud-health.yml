name: Diagnose Streamlit Cloud in browser
on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'app.py'
      - 'nieuwe_app.py'
      - 'scripts/cloud_browser_smoke.py'
      - '.github/workflows/streamlit-cloud-health.yml'
  pull_request:
    paths:
      - 'scripts/cloud_browser_smoke.py'
      - '.github/workflows/streamlit-cloud-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser harness
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install chromium --with-deps
      - name: Check public app in a real browser
        run: python scripts/cloud_browser_smoke.py
      - name: Upload screenshot of browser result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-smoke
          path: streamlit-cloud-smoke.png
          if-no-files-found: warn
          retention-days: 3
