# Connect this existing GitHub repository in Azure Pipelines and select this file.
# Runs synthetic/offline tests only; no deployment or production credentials.
trigger:
  branches:
    include:
      - feature/private-service-intake-20261026
pr:
  branches:
    include:
      - main
      - feature/neural-video-studio-safe-20261026
pool:
  vmImage: ubuntu-latest
jobs:
  - job: Validate
    timeoutInMinutes: 20
    strategy:
      matrix:
        Python311:
          pythonVersion: '3.11'
        Python312:
          pythonVersion: '3.12'
    steps:
      - checkout: self
        persistCredentials: false
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pythonVersion)
      - script: python -m pip install -r requirements.txt pytest
        displayName: Install test dependencies
      - script: python -m compileall -q .
        displayName: Compile Python source
      - script: python -m pytest -q tests/test_service_intake_core.py tests/test_intake_storage_boundary.py tests/test_entra_provider_guard.py --junitxml=test-results/intake.xml
        displayName: Verify disabled intake and storage boundaries
      - script: python -m pytest -q --junitxml=test-results/regression.xml
        displayName: Run regression suite
        condition: succeededOrFailed()
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: test-results/*.xml
          failTaskOnFailedTests: true
          testRunTitle: Intake and regression Python $(pythonVersion)
